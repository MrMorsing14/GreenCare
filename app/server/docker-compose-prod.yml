# Production stack. The api image is built/pushed by CI and pulled here.
# IMAGE_TAG and GHCR_OWNER come from the .env file the deploy workflow writes
# next to this file on the server.
services:
  api:
    image: ghcr.io/${GHCR_OWNER}/greencare-api:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - greencare

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - greencare

networks:
  greencare:
    driver: bridge

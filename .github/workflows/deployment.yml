name: CD - Deploy
#test
on:
  workflow_run:
    workflows: ["CD - Delivery"]
    types: [completed]
    branches: [main]

env:
  REMOTE_DIR: greencare-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
            chmod 600 ~/.ssh/ssh_key
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" | base64 -d > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/ssh_key "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/$REMOTE_DIR/nginx/conf.d"

      - name: Transfer docker-compose to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          scp -i ~/.ssh/ssh_key \
            app/server/docker-compose-prod.yml \
            "$SSH_USER@$SSH_HOST:~/$REMOTE_DIR/docker-compose.yml"

      - name: Transfer nginx config to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          scp -i ~/.ssh/ssh_key \
            app/server/nginx/conf.d/greencare.conf \
            "$SSH_USER@$SSH_HOST:~/$REMOTE_DIR/nginx/conf.d/"

      - name: Create .env file
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          umask 077
          {
            printf 'IMAGE_TAG=%s\n'  "$IMAGE_TAG"
            printf 'GHCR_OWNER=%s\n' "mrmorsing14"
          } > .env

      - name: Transfer .env to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          scp -i ~/.ssh/ssh_key .env "$SSH_USER@$SSH_HOST:~/$REMOTE_DIR/.env"

      - name: Pull image and (re)deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/ssh_key "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          cd ~/$REMOTE_DIR
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF